# docker-compose.yml — Orchestrate all custom-rag services

services:
  # ---------- FastAPI backend ----------
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "8000:8000"
    env_file: .env
    networks:
      - rag-network
    depends_on:
      - qdrant

  # ---------- Streamlit frontend ----------
  app:
    build:
      context: .
      dockerfile: Dockerfile.app
    ports:
      - "8501:8501"
    env_file: .env
    networks:
      - rag-network
    depends_on:
      - api

  # ---------- Qdrant vector store ----------
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage
    networks:
      - rag-network

volumes:
  qdrant_storage:

networks:
  rag-network:
    driver: bridge
