# docker-compose.yml — Orchestrate all custom-rag services

services:
  # ---------- FastAPI backend ----------
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      - QDRANT_URL=http://qdrant:6333
      - OLLAMA_URL=http://host.docker.internal:11434
    networks:
      - rag-network
    depends_on:
      - qdrant
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ---------- Streamlit frontend ----------
  app:
    build:
      context: .
      dockerfile: Dockerfile.app
    ports:
      - "8501:8501"
    env_file: .env
    environment:
      - API_URL=http://api:8000
    networks:
      - rag-network
    depends_on:
      - api
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ---------- Qdrant vector store ----------
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage
    networks:
      - rag-network

volumes:
  qdrant_storage:

networks:
  rag-network:
    driver: bridge
