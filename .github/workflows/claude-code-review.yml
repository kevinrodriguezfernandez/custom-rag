name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  pytest:
    name: pytest + coverage
    runs-on: ubuntu-latest
    outputs:
      coverage_report: ${{ steps.coverage.outputs.report }}
      tests_passed: ${{ steps.coverage.outputs.passed }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run pytest with coverage
        id: coverage
        run: |
          set +e
          uv run pytest \
            --cov=api \
            --cov=ingestion \
            --cov=shared \
            --cov-report=term-missing \
            --tb=short \
            -q 2>&1 | tee pytest_output.txt
          EXIT_CODE=$?
          set -e

          if [ $EXIT_CODE -eq 0 ]; then
            echo "passed=true" >> $GITHUB_OUTPUT
          else
            echo "passed=false" >> $GITHUB_OUTPUT
          fi

          # Truncate to last 150 lines to stay within GitHub Actions output limits
          echo "report<<EOF" >> $GITHUB_OUTPUT
          tail -150 pytest_output.txt >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

  claude-review:
    name: Claude Code Review
    runs-on: ubuntu-latest
    needs: pytest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies + linters
        run: |
          uv sync --group dev
          uv pip install pylint flake8

      - name: Run flake8
        id: flake8
        run: |
          uv run flake8 . --max-line-length=100 --output-file=flake8_report.txt || true
          # Truncate to 50 lines — flake8 output is per-violation, keep it bounded
          echo "output<<EOF" >> $GITHUB_OUTPUT
          head -50 flake8_report.txt >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Run pylint
        id: pylint
        run: |
          uv run pylint api ingestion shared --output-format=text > pylint_report.txt || true
          # Truncate to 80 lines to stay within expression size limits
          echo "output<<EOF" >> $GITHUB_OUTPUT
          head -80 pylint_report.txt >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Build review context
        id: context
        run: |
          # Write all report files so Claude can read them directly,
          # avoiding large inline expression interpolation
          echo "TESTS_PASSED=${{ needs.pytest.outputs.tests_passed }}" >> $GITHUB_ENV

      - name: Run Claude Code Review
        uses: anthropics/claude-code-action@beta
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          direct_prompt: |
            You are a senior software engineer performing a thorough code review.

            ## Test Results

            **Tests passed:** ${{ needs.pytest.outputs.tests_passed }}

            **Coverage report** (last 150 lines):
            ```
            ${{ needs.pytest.outputs.coverage_report }}
            ```

            ## Linter Results

            ### flake8 (first 50 violations)
            ```
            ${{ steps.flake8.outputs.output }}
            ```

            ### pylint (first 80 lines)
            ```
            ${{ steps.pylint.outputs.output }}
            ```

            ## Review Checklist

            Use the test results, coverage report, and linter output above as context, then review the PR diff for:

            1. **Correctness** – Does the logic work as intended? Edge cases or bugs?
            2. **Code quality** – Readable, well-structured, consistent with the codebase?
            3. **Test coverage** – Are new/changed code paths covered? Flag any gaps in coverage shown above.
            4. **Linter violations** – Flag any issues from flake8/pylint that are non-trivial or indicate real problems. Skip pure style noise.
            5. **Security** – Injection risks, exposed secrets, unsafe inputs, auth issues?
            6. **Performance** – Obvious inefficiencies, unnecessary computation?
            7. **Breaking changes** – Does this break existing interfaces or contracts?

            Be direct and specific. Point to exact lines when possible.
            If the code is solid, say so — don't invent issues.
            Summarize your verdict at the end: **Approve / Request Changes / Needs Discussion**.
